services:
  - type: web
    name: admon
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: admon-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: BASE_URL
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: MODEL
        sync: false
      - key: ADMON_CONTRACT_ADDRESS
        sync: false
      - key: ADMON_RELAYER_KEYSTORE_PATH
        sync: false
      - key: ADMON_RELAYER_KEYSTORE_JSON
        sync: false
      - key: ADMON_RELAYER_KEYSTORE_PASSWORD
        sync: false
      - key: ADMON_RELAYER_PRIVATE_KEY
        sync: false
      - key: ADMON_CHAIN_SETTLEMENT_REQUIRED
        value: "true"
    plan: starter

databases:
  - name: admon-db
    databaseName: admon
    user: admon
    plan: basic-256mb
